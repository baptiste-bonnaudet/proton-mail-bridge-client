name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Only the canonical repo publishes to npm; forks tagging releases must not.
    if: github.repository == 'googlarz/proton-mail-bridge-client'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # no npm cache here: release artifacts must not be exposed to
          # cache-poisoning (zizmor cache-poisoning audit)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
