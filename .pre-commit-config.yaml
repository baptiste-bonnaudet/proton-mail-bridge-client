# Security-first pre-commit configuration
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Tier 0: hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: check-json
      # Tier 1: secrets & keys
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: [--maxkb=512]

  # Tier 1: secret scanning (tokens, high-entropy strings, private keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Tier 2: SAST baseline over source
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        args: [--config, p/security-audit, --config, p/secrets, --error, --quiet]
        files: \.(ts|mjs)$

  # Tier 2: shell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Tier 3: container hygiene
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Tier 4: CI hardening
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
